                                    rightArea.style.display = 'none';
                                } else if (wrapper.requestFullscreen) {
                                    wrapper.requestFullscreen().catch(() => leftArea.classList.add('fs-active'));
                                } else if (wrapper.webkitRequestFullscreen) {
                                    wrapper.webkitRequestFullscreen();
                                } else {
                                    leftArea.classList.add('fs-active'); 
                                }
                            }
                        };
                    }
                }, 0);
            }

            const modalTitleEl = document.getElementById('modal-title');
            modalTitleEl.innerText = file.filename;
            modalTitleEl.title = file.filename;

            document.getElementById('modal-views').innerText = (file.views + 1);
            document.getElementById('modal-date-display').innerText = `Added: ${new Date(file.date).toLocaleDateString()}`;
            document.getElementById('modal-desc').innerText = file.description || ""; 
            
            updateModalFavorite(file.rating === 1);
            renderModalTags(file.tags);
            renderSuggestedMedia(file);

            document.getElementById('modal-layout-container').style.transform = 'translateY(0px)';
            modal.style.display = 'flex';
            showControls();
            
            await fetch(`/api/media/${file.id}/view`, { method: 'POST' });
            file.views += 1; 
            renderGrid();
        }

        function closeModal() {
            closeTitleEditor();
            
            modalCleanups.forEach(fn => fn());
            modalCleanups = [];
            
            const vid = document.getElementById('main-video');
            if (vid) {
                vid.pause();
                vid.removeAttribute('src');
                vid.load();
            }
            
            document.body.style.position = '';
            document.body.style.top = '';
            document.body.classList.remove('modal-lock');
            window.scrollTo({top: savedScrollY, behavior: 'instant'});

            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal-media-container').innerHTML = '';
            document.getElementById('modal-layout-container').style.transform = 'translateY(0px)';
        }

        function navigate(direction, e) {
            if (e) e.stopPropagation();
            currentViewingIndex += direction;
            if (currentViewingIndex < 0) currentViewingIndex = filteredMedia.length - 1;
            if (currentViewingIndex >= filteredMedia.length) currentViewingIndex = 0;
            openModal(currentViewingIndex);
        }

        function editDate() {
            const el = document.getElementById('modal-date-display');
            const file = filteredMedia[currentViewingIndex];
            const tzoffset = (new Date()).getTimezoneOffset() * 60000;
            const localISOTime = (new Date(file.date - tzoffset)).toISOString().slice(0, 16);
            
            el.innerHTML = `<input type="datetime-local" id="date-edit-input" value="${localISOTime}" onblur="saveDate()" onkeydown="if(event.key === 'Enter') saveDate()" onclick="try { this.showPicker(); } catch(e) {}">`;
            const input = document.getElementById('date-edit-input');
            input.focus();
            try { input.showPicker(); } catch(e) {}
        }

        async function saveDate() {
            const input = document.getElementById('date-edit-input');
            if(!input) return;
            const newDate = new Date(input.value).getTime();
            const file = filteredMedia[currentViewingIndex];
            
            if (!isNaN(newDate) && newDate !== file.date) {
                file.date = newDate;
                await fetch(`/api/media/${file.id}/date`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ date: newDate }) });
            }
            document.getElementById('modal-date-display').innerText = `Added: ${new Date(file.date).toLocaleDateString()}`;
            renderGrid();
        }

        let touchStartY = 0;
        let touchStartX = 0;
        let isDraggingModal = false;
        const modalLayout = document.getElementById('modal-layout-container');
        
        modalLayout.addEventListener('touchstart', e => {
            if (!e.target.closest('#modal-left-area')) return;
            touchStartY = e.changedTouches[0].screenY;
            touchStartX = e.changedTouches[0].screenX;
            isDraggingModal = true;
            modalLayout.style.transition = 'none';
            document.getElementById('modal-left-area').style.transition = 'none';
        }, {passive: true});
        
        modalLayout.addEventListener('touchmove', e => {
            if (!isDraggingModal) return;
            const currentY = e.changedTouches[0].screenY;
            const currentX = e.changedTouches[0].screenX;
            const deltaY = currentY - touchStartY;
            const deltaX = currentX - touchStartX;
            
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 10) {
                isDraggingModal = false;
                modalLayout.style.transform = `translateY(0px)`;
                document.getElementById('modal-left-area').style.transform = `translateY(0px)`;
                return;
            }

            if (deltaY > 0 && window.innerWidth <= 768) {
                const leftArea = document.getElementById('modal-left-area');
                if (leftArea.classList.contains('fs-active')) {
                    leftArea.style.transform = `translateY(${deltaY}px)`;
                } else {
                    modalLayout.style.transform = `translateY(${deltaY}px)`;
                }
            }
        }, {passive: true});

        modalLayout.addEventListener('touchend', e => {
            if (!isDraggingModal) return;
            isDraggingModal = false;
            
            const leftArea = document.getElementById('modal-left-area');
            const touchEndY = e.changedTouches[0].screenY;
            const touchEndX = e.changedTouches[0].screenX;
            
            modalLayout.style.transition = 'transform 0.3s ease';
            leftArea.style.transition = 'transform 0.3s ease';
            
            if (touchEndY - touchStartY > 60 && Math.abs(touchEndX - touchStartX) < Math.abs(touchEndY - touchStartY) && window.innerWidth <= 768) {
                if (leftArea.classList.contains('fs-active')) {
                    leftArea.style.transform = `translateY(100vh)`;
                    setTimeout(() => {
                        leftArea.classList.remove('fs-active');
                        leftArea.style.transform = '';
                        leftArea.style.transition = '';
                        document.querySelector('.modal-right').style.display = '';
                    }, 300);
                } else {
                    modalLayout.style.transform = `translateY(100vh)`;
                    setTimeout(closeModal, 300);
                }
            } else {
                modalLayout.style.transform = `translateY(0px)`;
                leftArea.style.transform = `translateY(0px)`;
                setTimeout(() => {
                    leftArea.style.transform = '';
                    leftArea.style.transition = '';
                }, 300);
            }
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (justScrubbed) return; 

            if (!e.target.closest('.title-wrapper')) {
                closeTitleEditor();
            }
            
            const isMobile = window.innerWidth <= 768;
            const leftArea = document.getElementById('modal-left-area');
            const clickedBackground = e.target.classList.contains('modal-overlay') || 
                e.target.classList.contains('modal-left') || 
                e.target.id === 'modal-media-container' ||
                e.target.classList.contains('video-wrapper') ||
                e.target.classList.contains('image-wrapper');

            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || leftArea.classList.contains('fs-active');

            if (isFullscreen) {
                if (clickedBackground && !e.target.closest('.custom-controls')) {
                    return; 
                }
            }

            if (clickedBackground && !e.target.closest('.custom-controls')) {
                if (isMobile && (e.target.classList.contains('modal-left') || e.target.id === 'modal-media-container' || e.target.classList.contains('video-wrapper') || e.target.classList.contains('image-wrapper'))) {
                    return; 
                }
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Delete' && isBulkMode && selectedIds.size > 0) {
                deleteSelected();
            }

            if (e.key === 'Escape') {
                closeAllDropdowns(null, true);
                closeTitleEditor();
                
                const leftArea = document.getElementById('modal-left-area');
                if (leftArea && leftArea.classList.contains('fs-active')) {
                    leftArea.classList.remove('fs-active');
                    if (window.innerWidth <= 768) document.querySelector('.modal-right').style.display = '';
                    return;
                }
                
                if (isBulkMode) {
                    isBulkMode = false;
                    selectedIds.clear();
                    renderGrid();
                } else if (document.getElementById('settings-modal').style.display === 'flex') {
                    closeSettingsModal();
                } else if (document.getElementById('modal').style.display === 'flex') {
                    if(!document.activeElement.isContentEditable) closeModal();
                } else if (document.getElementById('search-input').value !== '') {
                    clearSearch();
                }
            }
            
            if (document.getElementById('modal').style.display === 'flex') {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
                
                const vid = document.getElementById('main-video');
                
                if (vid) {
                    if (e.key.toLowerCase() === 'm') {
                        vid.muted = !vid.muted;
                        document.getElementById('custom-mute-btn').innerHTML = vid.muted ? SVG_VOL_OFF : SVG_VOL_ON;
                        showControls();
                        return;
                    }
                    if (e.key.toLowerCase() === 'f') {
                        const fsBtn = document.getElementById('fullscreen-btn');
                        if(fsBtn) fsBtn.click();
                        return;
                    }
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        vid.volume = Math.min(1, vid.volume + 0.1);
                        vid.muted = false;
                        document.getElementById('custom-mute-btn').innerHTML = SVG_VOL_ON;
                        showControls();
                        return;
                    }
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        vid.volume = Math.max(0, vid.volume - 0.1);
                        if (vid.volume === 0) {
                            vid.muted = true;
                            document.getElementById('custom-mute-btn').innerHTML = SVG_VOL_OFF;
                        }
                        showControls();
                        return;
                    }
                } else {
                    if (e.key.toLowerCase() === 'f') {
                        const imgFsBtn = document.getElementById('img-fullscreen-btn');
                        if(imgFsBtn) imgFsBtn.click();
                        return;
                    }
                }
                
                if (e.code === 'Space') {
                    if (vid) {
                        e.preventDefault();
                        vid.paused ? vid.play() : vid.pause();
                    }
                    return;
                }
                
                if (e.key === 'ArrowRight' && e.shiftKey) { navigate(1); return; }
                if (e.key === 'ArrowLeft' && e.shiftKey) { navigate(-1); return; }

                if (e.key === 'ArrowRight') {
                    if (vid) { e.preventDefault(); vid.currentTime += 10; if(vid.paused) vid.play(); }
                    else navigate(1);
                }
                if (e.key === 'ArrowLeft') {
                    if (vid) { e.preventDefault(); vid.currentTime -= 10; if(vid.paused) vid.play(); }
                    else navigate(-1);
                }
            }
        });

        document.getElementById('tag-input').addEventListener('input', async function (e) {
            const newTag = this.value.trim();
            const file = filteredMedia[currentViewingIndex];
            
            const exists = Array.from(document.getElementById('tag-suggestions').options).some(opt => opt.value === newTag);
            
            if (exists && !file.tags.includes(newTag)) {
                file.tags.push(newTag);
                await fetch(`/api/media/${file.id}/tags`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tags: file.tags }) });
                updateDatalist();
                renderModalTags(file.tags);
                renderGrid();
                this.value = ''; 
            }
        });

        document.getElementById('tag-input').addEventListener('keypress', async function (e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                const newTag = this.value.trim();
                const file = filteredMedia[currentViewingIndex];
                if (!file.tags.includes(newTag)) {
                    file.tags.push(newTag);
                    await fetch(`/api/media/${file.id}/tags`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tags: file.tags }) });
                    updateDatalist();
                    renderModalTags(file.tags);
                    renderGrid();
                }
                this.value = '';
            }
        });

        async function removeTag(tagToRemove, e) {
            e.stopPropagation();
            const file = filteredMedia[currentViewingIndex];
            file.tags = file.tags.filter(t => t !== tagToRemove);
            await fetch(`/api/media/${file.id}/tags`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tags: file.tags }) });
            renderModalTags(file.tags);
            renderGrid();
        }

        let dragSrcEl = null;

        function renderModalTags(tags) {
            const container = document.getElementById('modal-tags');
            container.innerHTML = tags.map((t, index) => `
                <span class="tag draggable-tag" draggable="true" data-index="${index}" style="font-size: 1rem; padding: 5px 10px; cursor: grab;" onclick="filterByTag('${t}', event)">
                    ${t} <span class="tag-remove" onclick="removeTag('${t}', event)">×</span>
                </span>
            `).join('');

            const tagEls = container.querySelectorAll('.draggable-tag');
            tagEls.forEach(el => {
                el.addEventListener('dragstart', handleDragStart);
                el.addEventListener('dragenter', handleDragEnter);
                el.addEventListener('dragover', handleDragOver);
                el.addEventListener('dragleave', handleDragLeave);
                el.addEventListener('drop', handleDrop);
                el.addEventListener('dragend', handleDragEnd);
            });
        }

        function handleDragStart(e) {
            dragSrcEl = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.index);
            this.style.opacity = '0.4';
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            this.classList.add('over');
        }

        function handleDragLeave(e) {
            this.classList.remove('over');
        }

        async function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            if (dragSrcEl !== this) {
                const srcIdx = parseInt(dragSrcEl.dataset.index);
                const destIdx = parseInt(this.dataset.index);
                const file = filteredMedia[currentViewingIndex];
                
                const movedTag = file.tags.splice(srcIdx, 1)[0];
                file.tags.splice(destIdx, 0, movedTag);
                
                await fetch(`/api/media/${file.id}/tags`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tags: file.tags }) });
                renderModalTags(file.tags);
                renderGrid();
            }
            return false;
        }

        function handleDragEnd(e) {
            this.style.opacity = '1';
            document.querySelectorAll('.draggable-tag').forEach(el => el.classList.remove('over'));
        }

        initApp();
    </script>
</body>
